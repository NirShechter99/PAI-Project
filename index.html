<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Tactics - Flexbox Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Football Tactics: Flexbox Edition</h1>
        <div class="level-info">
            <span id="level-indicator">Level 1 of 8</span>
            <select id="level-selector"></select>
        </div>
    </header>

    <main class="game-wrapper">
        <aside class="controls-panel">
            <div class="instructions-card">
                <h2>Coach's Instructions:</h2>
                <p id="instruction-text"></p>
                <p class="attempts">Attempts: <span id="attempts-count">0</span></p>
            </div>

            <div class="controls-form">
                <div class="control-group">
                    <label for="display">display:</label>
                    <select id="display" class="flex-prop">
                        <option value="block">block</option>
                        <option value="flex">flex</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="flex-direction">flex-direction:</label>
                    <select id="flex-direction" class="flex-prop">
                        <option value="row">row</option>
                        <option value="row-reverse">row-reverse</option>
                        <option value="column">column</option>
                        <option value="column-reverse">column-reverse</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="justify-content">justify-content:</label>
                    <select id="justify-content" class="flex-prop">
                        <option value="flex-start">flex-start</option>
                        <option value="flex-end">flex-end</option>
                        <option value="center">center</option>
                        <option value="space-between">space-between</option>
                        <option value="space-around">space-around</option>
                        <option value="space-evenly">space-evenly</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="align-items">align-items:</label>
                    <select id="align-items" class="flex-prop">
                        <option value="stretch">stretch</option>
                        <option value="flex-start">flex-start</option>
                        <option value="flex-end">flex-end</option>
                        <option value="center">center</option>
                        <option value="baseline">baseline</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="flex-wrap">flex-wrap:</label>
                    <select id="flex-wrap" class="flex-prop">
                        <option value="nowrap">nowrap</option>
                        <option value="wrap">wrap</option>
                        <option value="wrap-reverse">wrap-reverse</option>
                    </select>
                </div>
            </div>

            <div class="action-buttons">
                <button id="btn-check" class="btn primary">Check Solution</button>
                <button id="btn-reset" class="btn secondary">Reset Level</button>
                <button id="btn-next" class="btn success hidden">Next Level ➔</button>
            </div>
            
            <div id="feedback-message" class="feedback"></div>
        </aside>

        <section class="pitch-wrapper">
            <div id="pitch" class="pitch"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
